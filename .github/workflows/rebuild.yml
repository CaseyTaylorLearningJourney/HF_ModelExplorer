name: Sync

# Scheduled runs reuse the latest commit on main (they don't create a new
# push), so without run-name GitHub keeps labeling every deploy with that
# last commit message. Make the Actions title reflect the sync instead.
run-name: >-
  ${{ github.event_name == 'schedule' && 'Sync Hugging Face data'
      || github.event_name == 'workflow_dispatch' && 'Manual sync'
      || 'Deploy from push' }}

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
  schedule:
    - cron: "0 */2 * * *" # every other hour
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync site + snapshots
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python ModelExplorer.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
